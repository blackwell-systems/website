site:
  name: Blackwell Systems
  site: 'https://blackwell-systems.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Blackwell Systems
    template: '%s — Blackwell Systems'
  description: "AI Infrastructure & Consulting. We cut your AI token costs by 50-79%. GCF wire format, agent-lsp, mcp-assert, knowing. Founded by Dayna Blackwell."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Blackwell Systems
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark:only'
